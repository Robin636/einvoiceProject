  {% for message in messages %}
    <div class="container-fluid p-0">
{#      <div class="alert alert-{{ message.tags }} alert-dismissible" role="alert">#}
        <div class="alert {{ message.tags }} alert-dismissible" role="alert">

      </div>
    </div>
  {% endfor %}
