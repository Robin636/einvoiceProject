{% extends 'base.html' %}

{% block title %}Rechnung löschen{% endblock title %}

{% block content %}
  
  <div class="container">
    <form method="post" class="card">{% csrf_token %}
		<h4>Rechnung:</h4>
		<p>"{{invoice.number}}: {{ invoice.customer }} vom {{ invoice.date_created|date:"d.m.y" }}" löschen?</p>
      
    <div style="margin-left: 400px">
      <a style="margin-right: 40px;" class="btn btn-secondary" href="{% url 'einvoice:invoice_list' %}">Cancel</a>
      <button type="submit" class="btn btn-danger">Löschen</button>
    </div>
  

	</form>
  
   

  
  </div>

{% endblock content %}
