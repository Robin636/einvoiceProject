{% extends 'base.html' %}

{% block title %}{{ invoice.number }}{% endblock title %}

{% block content %}
  {{ form.media }}
  <form action="" method="post">{% csrf_token %}
    
    <div class="container text-left">
      <div class="row">
        <div class="col-2">Dokument</div>
        <div class="col-4">{{ form.type }}</div>
      </div>  
      <div class="row">
        <div class="col-2">Lieferdatum</div>
        <div class="col-4">{{ form.date_deliver }}</div>
      </div> 
      <div class="row">
        <div class="col-2">Zahlungsziel</div>
        <div class="col-4">{{ form.date_due }}</div>
      </div> 
    </div>
  
    <br>
    <div style="margin-left: 410px">
      <a  style="margin-right: 40px;" class="btn btn-secondary" href="{% url 'einvoice:invoice_detail' pk=invoice.pk %}">Cancel</a>
      <button type="submit" class="save btn btn-success">Sichern</button>
    </div>

  </form>

{% endblock content %}
